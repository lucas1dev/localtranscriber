name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
          rustc --version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      # Depois do rust-cache de propósito: os passos "post" rodam em ordem
      # inversa, então este cache é salvo antes de o rust-cache limpar o
      # src-tauri/target (que apagaria o ffmpeg-build).
      - name: Cache do FFmpeg compilado (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/target/ffmpeg-build
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/sidecars.lock.json', 'scripts/build-ffmpeg-macos.sh') }}

      - run: npm ci

      # O tauri-build exige os sidecars de bundle.externalBin: eles vêm antes de
      # qualquer passo do cargo.
      - name: Sidecars (macOS)
        if: runner.os == 'macOS'
        run: |
          # ffmpeg do sistema só para gerar a mídia de teste do verify-sidecars.sh.
          brew install ffmpeg
          scripts/fetch-sidecars.sh
          scripts/verify-sidecars.sh

      - name: Sidecars (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-sidecars.ps1

      - name: Verifica sidecars (Windows)
        if: runner.os == 'Windows'
        # TEMPORARIO: so para validar os passos seguintes; sera revertido.
        continue-on-error: true
        shell: pwsh
        run: ./scripts/verify-sidecars.ps1

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - run: npm run test:ui

      - run: npm run tauri build

      - name: Upload do .dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-transcriber-${{ matrix.target }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload do .msi e do -setup.exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-transcriber-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: local-transcriber-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*-setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
